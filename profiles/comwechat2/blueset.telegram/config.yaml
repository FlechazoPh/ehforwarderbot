token: "YOUR_TELEGRAM_BOT_TOKEN" # 必须修改，可参考 https://winamp.eu.org/266.html
admins:
- YOUR_TELEGRAM_USER_ID # 必须修改，可参考 https://winamp.eu.org/266.html
flags: # 可选 flag，详见 https://github.com/ehForwarderBot/efb-telegram-master?tab=readme-ov-file#experimental-flags
    retry_on_error: true
    # 关闭自动语言设置，使用 systemd 启动时默认中文
    auto_locale: false
    animated_stickers: true
    topic_group: -1001744307269 # 神隐 开启 topic_group 所用，参考 https://www.jiz4oh.com/2025/04/set-topic-in-efb
